name: Publicar release

on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler versão
        id: v
        run: echo "tag=$(tr -d '[:space:]' < release/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # instalador (setup.exe) vai junto quando existir; o zip portátil sempre (a atualização automática usa o zip)
          FILES="release/AgentMonitor-portable-win64.zip"
          [ -f release/AgentMonitor-Setup-win64.exe ] && FILES="$FILES release/AgentMonitor-Setup-win64.exe"
          NOTES="Agent Monitor para Windows 64-bit. Instalador: baixe AgentMonitor-Setup-win64.exe e execute (não pede administrador; cria atalho no menu Iniciar e desinstalador). Portátil: baixe AgentMonitor-portable-win64.zip, extraia a pasta inteira e execute AgentMonitor\\AgentMonitor.exe."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "Agent Monitor $TAG" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
