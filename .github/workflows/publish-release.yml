name: Publicar release

on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler versão
        id: v
        run: echo "tag=$(tr -d '[:space:]' < release/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NOTES="Agent Monitor para Windows 64-bit. Baixe AgentMonitor-portable-win64.zip, extraia a pasta inteira e execute AgentMonitor\\AgentMonitor.exe."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/AgentMonitor-portable-win64.zip --clobber
          else
            gh release create "$TAG" release/AgentMonitor-portable-win64.zip \
              --title "Agent Monitor $TAG" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
